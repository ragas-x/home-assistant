services:
  dashboard:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: kitchen-dashboard
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      SUPABASE_URL: ${SUPABASE_URL:-http://192.168.1.28:8000}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in the repository .env file}
    ports:
      - "${KITCHEN_HTTP_PORT:-3000}:3000"
    volumes:
      - ${KITCHEN_DATA_DIR:-/DATA/AppData/kitchen-dashboard/data}:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
